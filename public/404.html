    />
    <!--
      This is a genuinely static file (public/404.html, copied as-is to
      dist/404.html) — GitHub Pages serves it for any unmatched path under
      this project's Pages site. It is NOT the "copy index.html to
      404.html" SPA-rewrite trick: this site has no client-side router
      (see App.jsx — anchor navigation only) and no deep-linkable routes,
      so there is nothing for a rewritten index.html to route to. A real
      404 for a genuinely nonexistent path is correct behavior here, not a
      bug — see docs/PROJECT_STATUS.md's Phase 3-D entry.

      Static (not built by Vite), so links below are hardcoded to the
      GitHub Pages project path rather than importing site CSS/using
      import.meta.env.BASE_URL — update these if a custom domain is ever
      configured (see README.md's deployment section).
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1625;
        color: #f4f1ea;

      .code {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #a4865c;
        font-weight: 600;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.5;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }
      p {

        line-height: 1.7;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        padding: 0.85rem 1.75rem;
        border-radius: 2px;
        background: #a4865c;
        color: #0b1625;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #f4f1ea; }
    </style>
  </head>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1625" />

    <!-- Typography unification — the whole site (headings, body, nav,
         buttons, numbers) renders in a single family: Noto Sans, with
         Noto Sans KR as its Korean-glyph companion — see
         src/styles/variables.css's --font-kr/--font-heading/--font-body,
         which all now point at this same stack. preconnect warms both
         Google Fonts origins before the stylesheet request; display=swap
         avoids invisible text while the font downloads (falls back to the
         system sans-serif in --font-kr's own fallback chain until then). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap"
    />

    <title>LEO Business Advisory | Boosuk Leo Suh</title>
    <meta
      name="description"
      content="Executive advisory for CEOs and founders — growth strategy, brand turnaround, new business launch and global expansion, led by a 30+ year global CEO and brand builder."
    />
    <!-- Everyone should index this page; nothing on the public site is
         private. The admin CMS (admin/index.html) carries its own
         noindex, separately. -->
    <meta name="robots" content="index, follow" />

    <!-- Custom domain (leobizadvisory.com) — see vite.config.js's `base`
         and docs/CUSTOM_DOMAIN_SETUP.md. If the site ever moves off this
         domain, every absolute URL on this page (canonical, og:url,
         og:image, twitter:image, JSON-LD) needs updating to match. -->
    <link rel="canonical" href="https://leobizadvisory.com/" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LEO BUSINESS ADVISORY" />
    <meta property="og:title" content="LEO Business Advisory | Boosuk Leo Suh" />
    <meta
      property="og:description"
      content="Executive advisory for CEOs and founders — growth strategy, brand turnaround, new business launch and global expansion, led by a 30+ year global CEO and brand builder."
    />
    <meta property="og:url" content="https://leobizadvisory.com/" />
    <!-- Placeholder share preview (public/og-image.png) — a text/brand-color
         graphic generated from this same page's own approved copy (name,
         title, site name), not a photo. Swap this file for real
         photography once available; the meta tags below don't need to
         change, only the file itself (keep it at 1200x630). -->
    <meta property="og:image" content="https://leobizadvisory.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LEO Business Advisory — Boosuk &quot;Leo&quot; Suh, Founder &amp; President" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />

    <!-- Twitter/X Card — twitter:image requires a raster format (no SVG),
         which is why favicon.svg can't double as this; og-image.png above
         is reused here. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LEO Business Advisory | Boosuk Leo Suh" />
    <meta
      name="twitter:description"
      content="Executive advisory for CEOs and founders — growth strategy, brand turnaround, new business launch and global expansion, led by a 30+ year global CEO and brand builder."
    />
    <meta name="twitter:image" content="https://leobizadvisory.com/og-image.png" />

    <!-- JSON-LD (schema.org Person + ProfessionalService) — every field
         below is sourced from src/data/profile.js; do not add facts here
         (awards, reviews, employee counts, founding dates, etc.) that
         aren't already verified there against the Founder Profile source
         document. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://leobizadvisory.com/#person",
            "name": "Boosuk \"Leo\" Suh",
            "alternateName": "서부석",
            "jobTitle": "Founder & President",
            "url": "https://leobizadvisory.com/",
            "email": "mailto:leosuh00@gmail.com",
            "telephone": "+82-10-9033-2237",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Seoul",
              "addressCountry": "KR"
            },
            "worksFor": { "@id": "https://leobizadvisory.com/#organization" },
            "description": "Executive advisory for CEOs and founders — growth strategy, brand turnaround, new business launch and global expansion, led by a 30+ year global CEO and brand builder."
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://leobizadvisory.com/#organization",
            "name": "LEO BUSINESS ADVISORY",
            "url": "https://leobizadvisory.com/",
            "email": "mailto:leosuh00@gmail.com",
            "telephone": "+82-10-9033-2237",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Seoul",
              "addressCountry": "KR"
            },
            "founder": { "@id": "https://leobizadvisory.com/#person" },
            "description": "Executive advisory for CEOs and founders — growth strategy, brand turnaround, new business launch and global expansion, led by a 30+ year global CEO and brand builder."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
